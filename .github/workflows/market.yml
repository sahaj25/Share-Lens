name: Market Snapshot Bot

on:
  schedule:
    # ⏰ All times in UTC — IST is UTC+5:30
    - cron: "25 8 * * 1-5"    # 13:55 IST — weekdays only
    - cron: "30 7 * * 1-5"    # 13:00 IST — weekdays only
    - cron: "0 10 * * 1-5"    # 15:30 IST — weekdays only
  workflow_dispatch:           # manual trigger for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug TOTP secret length
          run: |
            echo "TOTP token length: ${#ANGEL_TOTP_TOKEN}"
            echo "First 4 chars: ${ANGEL_TOTP_TOKEN}"
          env:
            ANGEL_TOTP_TOKEN: ${{ secrets.ANGEL_TOTP_TOKEN }}

      # ✅ KEY FIX: sync runner clock via chronyc (reliable on Ubuntu 22.04+)
      # GitHub Actions runners can have clock drift which breaks TOTP validation.
      # chronyc is pre-installed and more reliable than ntpdate on modern Ubuntu.
      - name: Sync system clock (fix TOTP clock drift)
        run: |
          echo "⏱ Before sync:"
          date -u
          sudo chronyc makestep || sudo chronyc -a makestep || echo "chronyc unavailable, continuing"
          echo "⏱ After sync:"
          date -u

      - name: Set timezone to IST
        run: |
          sudo timedatectl set-timezone Asia/Kolkata
          echo "🕐 Current IST time: $(date)"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py
        env:
          ANGEL_API_KEY:        ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:      ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:       ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_TOKEN:     ${{ secrets.ANGEL_TOTP_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}