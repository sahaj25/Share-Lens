name: Share-Lens Stock Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - share_guruji

jobs:
  scan-and-notify:
    name: Run Scanner & Notify Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔍 Debug (safe to keep)
      - name: Debug repo structure
        run: |
          echo "Current directory:"
          pwd
          echo "Files in repo:"
          ls -R

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install smartapi-python pyotp requests logzero websocket-client
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ✅ Run scanner safely (never crash workflow)
      - name: Run scanner.py
        run: |
          echo "▶ Running scanner.py …"
          python backend/scanner.py > scanner_output.txt || echo "Scanner failed but continuing..."
          echo "--- Output ---"
          cat scanner_output.txt || echo "No output generated"
        env:
          ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}

      # ✅ Telegram should NOT break workflow
      - name: Send Telegram notification
        run: |
          echo "▶ Sending Telegram notification..."
          python backend/telegram_notify.py scanner_output.txt || echo "Telegram failed, skipping..."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:  ${{ secrets.TELEGRAM_CHAT_IDS }}

      # ✅ Always upload output
      - name: Upload scanner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-output-${{ github.run_number }}
          path: scanner_output.txt
          retention-days: 7